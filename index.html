<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>LA Exhibit: Chrome Aircraft AR</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google model-viewer library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>

  <div class="flash-overlay" id="flash"></div>

  <header class="header">
    <h1>Chrome Winged Relic</h1>
    <p>Downtown Los Angeles Exhibit</p>
  </header>

  <div class="gesture-hint">Drag to rotate • Pinch to zoom</div>

  <div class="progress-bar" id="progressBar">
    <div class="fill" id="progressFill"></div>
  </div>

  <model-viewer
    id="aircraftViewer"
    src="assets/aircraft_chrome.glb"
    ios-src="assets/aircraft_chrome.usdz"
    skybox-image="assets/dtla_skybox.hdr"
    environment-image="assets/dtla_skybox.hdr"
    alt="Chrome Aircraft Sculpture"
    auto-rotate
    auto-rotate-delay="1000"
    rotation-per-second="14deg"
    camera-controls
    touch-action="pan-y"
    camera-orbit="35deg 82deg 1.3m"
    min-camera-orbit="auto auto 0.5m"
    max-camera-orbit="auto auto 3.0m"
    shadow-intensity="0.2"
    shadow-softness="1.0"
    exposure="1.0"
    ar
    ar-modes="quick-look scene-viewer webxr"
    ar-scale="auto"
    ar-placement="floor"
  >
    <!-- Accessible, valid AR slot button (no display:none) -->
    <button slot="ar-button" id="nativeArBtn" class="visually-hidden"></button>

    <!-- Surface Tracking & Prompt Hint for Mobile AR -->
    <div id="arPrompt" slot="ar-prompt">
      <div class="ar-scanning-pill">Move phone slowly to detect floor or table</div>
    </div>
  </model-viewer>

  <nav class="controls-bar">
    <button class="btn btn-shutter" id="shutterBtn" aria-label="Take Snapshot">
      <svg viewBox="0 0 24 24">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
      Snap
    </button>
    <button class="btn btn-ar" id="customArBtn">
      View in Space (AR)
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
