<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>LA Exhibit: Chrome Aircraft</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Preload core 3D assets -->
  <link rel="preload" href="assets/dtla_skybox.hdr" as="fetch" type="image/vnd.radiance" crossorigin="anonymous">
  <link rel="preload" href="assets/aircraft_chrome.glb" as="fetch" type="model/gltf-binary" crossorigin="anonymous">

  <!-- Exhibit Viewer Engine -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

  <!-- A-Frame & 8th Wall Engine Core -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/web/dist/xrweb.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/web/dist/xrextras.js"></script>
</head>
<body>

  <div class="flash-overlay" id="flash"></div>

  <header class="header">
    <h1>Chrome Winged Relic</h1>
    <p>Downtown Los Angeles Exhibit</p>
  </header>

  <div class="gesture-hint" id="statusHint">Drag to rotate • Pinch to zoom</div>

  <div class="progress-bar" id="progressBar">
    <div class="fill" id="progressFill"></div>
  </div>

  <!-- 1. FAST-BOOT 3D SKYBOX EXHIBIT (Active by default) -->
  <model-viewer
    id="aircraftViewer"
    src="assets/aircraft_chrome.glb"
    skybox-image="assets/dtla_skybox.hdr"
    environment-image="assets/dtla_skybox.hdr"
    loading="eager"
    reveal="auto"
    alt="Chrome Aircraft Sculpture"
    auto-rotate
    auto-rotate-delay="500"
    rotation-per-second="14deg"
    camera-controls
    touch-action="pan-y"
    camera-orbit="35deg 82deg 1.1m"
    min-camera-orbit="auto auto 0.2m"
    max-camera-orbit="auto auto 3.0m"
    shadow-intensity="0.2"
    shadow-softness="1.0"
    exposure="1.0"
  >
  </model-viewer>

  <!-- 2. DEDICATED WEBAR SURFACE SCENE -->
  <a-scene
    id="arScene"
    class="ar-hidden"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
  >
    <a-assets>
      <a-asset-item id="arModel" src="assets/aircraft_chrome.glb"></a-asset-item>
    </a-assets>

    <a-camera
      id="arCamera"
      position="0 1.6 0"
      raycaster="objects: .cantap"
      cursor="fuse: false; rayOrigin: mouse;"
    >
    </a-camera>

    <a-entity light="type: ambient; intensity: 0.8;"></a-entity>
    <a-entity light="type: directional; intensity: 1.5;" position="2 4 2"></a-entity>

    <a-entity
      id="arAircraft"
      gltf-model="#arModel"
      position="0 0 -1.5"
      scale="0.8 0.8 0.8"
      visible="false"
      xrextras-pinch-scale
      xrextras-two-finger-rotate
    >
    </a-entity>

    <a-plane
      id="arGroundPlane"
      class="cantap"
      rotation="-90 0 0"
      width="100"
      height="100"
      material="opacity: 0; transparent: true;"
    >
    </a-plane>
  </a-scene>

  <!-- Controls Bar -->
  <nav class="controls-bar">
    <button class="btn btn-shutter" id="shutterBtn" aria-label="Take Snapshot">
      <svg viewBox="0 0 24 24">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
      Snap
    </button>
    <button class="btn btn-ar" id="arToggleBtn">
      View in Space (AR)
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
